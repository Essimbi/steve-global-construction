<section class="services-grid-wrapper section" id="services-preview">
  <div class="container text-center">
    <span class="label">Expertise</span>
    <h2 class="display-text gold-gradient-text">Ce que nous faisons</h2>
  </div>

  <div class="container services-grid">
    @for (service of services; track service.id) {
      <div class="service-card glass glass-hover" appVanillaTilt>
        <div class="service-image-wrapper">
          <img [src]="service.image" [alt]="service.name" class="service-card-image">
          <div class="image-overlay"></div>
          <div class="service-icon-badge"><lucide-icon [name]="service.icon"></lucide-icon></div>
        </div>
        <div class="card-body">
          <div class="card-content">
            <h3 class="service-name">{{ service.name }}</h3>
            <p class="service-desc">{{ service.description }}</p>
          </div>
          <div class="card-footer">
            <a [routerLink]="['/services']" [fragment]="'service-' + service.id" class="learn-more">Détails <span class="arrow">→</span></a>
          </div>
        </div>
      </div>
    }
  </div>

  <div class="container grid-footer">
    <a routerLink="/services" class="btn btn-outline">Voir tous nos services</a>
  </div>
</section>
